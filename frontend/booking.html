<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Bookings</title>
  <style>
    body {
      background: #f6f9ff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #333;
    }
    .container {
      width: 80%;
      margin: 40px auto;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 0.3em;
      letter-spacing: -1px;
    }
    .subtitle {
      font-size: 1.1rem;
      color: #6b6d7a;
      margin-bottom: 2em;
    }
    .stats-row {
      display: flex;
      gap: 1.5em;
      margin-bottom: 2em;
    }
    .stat-card {
      flex: 1;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border-radius: 12px;
      text-align: center;
      padding: 2em 0.5em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .stat-number {
      font-size: 2.2rem;
      font-weight: 700;
      color: #3861fb;
      margin-bottom: 0.3em;
    }
    .stat-number.active {
      color: #18c964;
    }
    .stat-title {
      font-size: 1.1rem;
      color: #888;
      font-weight: 500;
    }
    .tabs {
      display: flex;
      margin-bottom: 1em;
      background: none;
    }
    .tab-btn {
      flex: 1;
      padding: 1em 0;
      text-align: center;
      border: none;
      background: #fff;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: #333;
      border-bottom: 2px solid transparent;
      transition: border-bottom 0.2s, color 0.2s;
    }
    .tab-btn.active {
      color: #3861fb;
      border-bottom: 3px solid #3861fb;
      background: #f6f9ff;
      border-radius: 6px 6px 0 0;
    }
    .tab-btn:disabled {
      color: #6b6d7a;
      cursor: not-allowed;
    }
    .booking-box {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3em 2em;
      min-height: 220px;
    }
    .ambulance-icon {
      font-size: 2.5rem;
      color: #3861fb;
      margin-bottom: 1em;
    }
    .no-booking-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.5em;
      color: #333;
    }
    .no-booking-desc {
      color: #6b6d7a;
      font-size: 1.07rem;
      margin-bottom: 1.5em;
    }
    .emergency-btn {
      background: #000;
      color: #fff;
      border: none;
      padding: 1em 1.5em;
      border-radius: 8px;
      font-size: 1.09rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(56,97,251,0.13);
      transition: background 0.15s;
    }
    .emergency-btn:hover {
      background: #3861fb;
    }
    @media (max-width: 800px) {
      .container { width: 95%; }
      .stats-row { flex-direction: column; gap: 1em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Bookings</h1>
    <div class="subtitle">Track and manage your ambulance bookings</div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-number">0</div>
        <div class="stat-title">Total Bookings</div>
      </div>
      <div class="stat-card">
        <div class="stat-number active">0</div>
        <div class="stat-title">Active</div>
      </div>
      <div class="stat-card">
        <div class="stat-number">0</div>
        <div class="stat-title">Completed</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active">Active Bookings (0)</button>
      <button class="tab-btn" disabled>Booking History (0)</button>
    </div>
    <div class="booking-box">
      <div class="ambulance-icon">
        <!-- Simple ambulance SVG icon -->
        <svg width="44" height="44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="7" y="19" width="30" height="12" rx="3" stroke="#3861fb" stroke-width="2" fill="#F6F9FF"/>
          <rect x="32" y="23" width="8" height="8" rx="2" stroke="#3861fb" stroke-width="2" fill="#fff"/>
          <circle cx="14" cy="32.5" r="2.5" fill="#3861fb"/>
          <circle cx="33" cy="32.5" r="2.5" fill="#3861fb"/>
          <rect x="20.5" y="14.5" width="5" height="8" rx="2" fill="#fff" stroke="#3861fb" stroke-width="2"/>
          <rect x="23" y="16" width="1.5" height="5" rx=".75" fill="#3861fb"/>
          <rect x="21" y="18.5" width="5" height="1.5" rx=".75" fill="#3861fb"/>
        </svg>
      </div>
      <div class="no-booking-title">No Active Bookings</div>
      <div class="no-booking-desc">You don't have any active ambulance bookings right now.</div>
      <button class="emergency-btn">Book Emergency Ambulance</button>
    </div>
  </div>
</body>
</html>
