<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Dashboard - RapidCare Ambulance</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
    }

    header {
      background: #0a1931;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }

    .container {
      padding: 20px;
    }

    .request-card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      text-align: center;
    }

    .request-card h3 {
      margin-bottom: 10px;
    }

    .btn {
      background: #1c5ed6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #1544a0;
    }

    #map {
      width: 100%;
      height: 400px;
      border-radius: 12px;
      display: none; /* hidden until request accepted */
    }
  </style>
</head>
<body>
  <header>
    🚑 RapidCare Ambulance - Driver Dashboard
  </header>

  <div class="container">
    <div class="request-card" id="requestCard">
      <h3>New Ambulance Request</h3>
      <p><b>Patient Name:</b> John Smith</p>
      <p><b>Patient Location:</b> 221B Baker Street, London</p>
      <button class="btn" onclick="acceptRequest()">Accept Request</button>
    </div>

    <div id="map"></div>
  </div>

  <script>
    let map, directionsService, directionsRenderer;

    function acceptRequest() {
      document.getElementById("requestCard").style.display = "none";
      document.getElementById("map").style.display = "block";
      initMap();
    }

    function initMap() {
      // Driver current location (this can be fetched using GPS/HTML5 Geolocation API)
      const driverLocation = { lat: 51.5074, lng: -0.1278 }; // London (example)
      
      // Patient location (normally fetched from database)
      const patientLocation = "221B Baker Street, London";

      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 14,
        center: driverLocation
      });

      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer();
      directionsRenderer.setMap(map);

      calculateRoute(driverLocation, patientLocation);
    }

    function calculateRoute(driverLocation, patientAddress) {
      directionsService.route(
        {
          origin: driverLocation,
          destination: patientAddress,
          travelMode: google.maps.TravelMode.DRIVING
        },
        (response, status) => {
          if (status === "OK") {
            directionsRenderer.setDirections(response);
          } else {
            alert("Directions request failed due to " + status);
          }
        }
      );
    }
  </script>

  <!-- Replace YOUR_API_KEY with your actual Google Maps API key -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>
</body>
</html>
